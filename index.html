<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购与物品清单 · 云同步</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    },
                    colors: {
                        base: '#0a0a0c',
                        card: '#131316',
                        elevated: '#1c1c21',
                    }
                }
            }
        };
    </script>
    <style>
        /* 自定义暗色细滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        /* 消除移动端点击高亮 */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-base text-zinc-100 font-sans antialiased min-h-screen selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- 顶部粘性导航与同步状态栏 -->
    <header class="sticky top-0 z-30 bg-base/85 backdrop-blur-xl border-b border-zinc-800/80">
        <div class="w-full px-3 sm:px-5 py-2.5">
            <!-- 第一行：标题 + 同步状态 + 进度统计 -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 min-w-0">
                        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white truncate">采购与物品清单</h1>
                        <!-- 同步状态徽章（点击可手动重试/刷新云端） -->
                        <button
                            type="button"
                            id="sync-status-pill"
                            title="点击立即同步云端"
                            class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:opacity-90 active:scale-95 transition-all cursor-pointer"
                        >
                            <span id="sync-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                            <span id="sync-status-text">已同步</span>
                        </button>
                        <!-- 最后更新时间 -->
                        <span id="last-updated-label" class="text-xs text-zinc-400 tabular-nums">最后更新: --</span>
                    </div>
                </div>

                <!-- 右侧进度统计 -->
                <div class="flex items-center gap-2.5 px-3 py-1 rounded-xl bg-card border border-zinc-800/90 text-xs sm:text-sm shrink-0">
                    <span class="text-zinc-400">已完成</span>
                    <span class="font-semibold text-white tabular-nums">
                        <span id="stat-completed" class="text-emerald-400">0</span>
                        <span class="text-zinc-600 mx-0.5">/</span>
                        <span id="stat-total">32</span>
                    </span>
                    <span id="stat-percent" class="text-xs text-zinc-500 tabular-nums">0%</span>
                </div>
            </div>

            <!-- 总体进度条 -->
            <div class="w-full h-1.5 bg-zinc-800/90 rounded-full overflow-hidden mb-2">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-500 to-emerald-400 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>

            <!-- 第二行：筛选切换 + 新增分类 / 重置 -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <!-- 状态筛选标签 -->
                <div class="inline-flex p-0.5 rounded-xl bg-card border border-zinc-800/90" role="tablist">
                    <button type="button" data-filter="all" class="filter-btn px-3 py-1 text-xs font-medium rounded-lg transition-all bg-elevated text-white shadow-sm">
                        全部
                    </button>
                    <button type="button" data-filter="active" class="filter-btn px-3 py-1 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200">
                        未完成
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn px-3 py-1 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200">
                        已完成
                    </button>
                </div>

                <!-- 右侧管理操作 -->
                <div class="flex items-center gap-2">
                    <button type="button" id="open-add-cat-btn" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25 active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        <span>新增分类</span>
                    </button>
                    <button type="button" id="open-reset-btn" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl bg-card text-zinc-400 border border-zinc-800 hover:text-zinc-200 hover:bg-elevated active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        <span>重置</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域：全宽横向优先智能瀑布流 -->
    <main class="w-full px-3 sm:px-5 py-3.5 pb-20">
        <div id="masonry-container" class="flex items-start gap-3 w-full"></div>
    </main>

    <!-- 弹窗 1：新增分类 -->
    <div id="add-cat-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-5 shadow-2xl">
            <h2 class="text-base font-bold text-white mb-1">新增分类</h2>
            <p class="text-xs text-zinc-400 mb-4">创建一个新的清单分组，创建后会自动同步到云端。</p>
            <form id="add-cat-form" class="space-y-4">
                <div>
                    <label for="new-cat-name" class="block text-xs font-medium text-zinc-300 mb-1.5">分类名称</label>
                    <input
                        type="text"
                        id="new-cat-name"
                        placeholder="例如：电子配件、日用品..."
                        maxlength="24"
                        required
                        class="w-full px-3 py-2 text-sm bg-base border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500/60 focus:ring-1 focus:ring-emerald-500/30"
                    >
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1.5">排列顺序</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="catColumn" value="left" class="peer sr-only" checked>
                            <div class="px-3 py-2 text-center text-xs font-medium rounded-xl border border-zinc-800 bg-base text-zinc-400 peer-checked:border-emerald-500/60 peer-checked:bg-emerald-500/15 peer-checked:text-emerald-300 transition-all">
                                靠前排列
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="catColumn" value="right" class="peer sr-only">
                            <div class="px-3 py-2 text-center text-xs font-medium rounded-xl border border-zinc-800 bg-base text-zinc-400 peer-checked:border-sky-500/60 peer-checked:bg-sky-500/15 peer-checked:text-sky-300 transition-all">
                                顺延排布
                            </div>
                        </label>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" id="cancel-add-cat" class="px-3.5 py-2 text-xs font-medium rounded-xl bg-elevated text-zinc-300 hover:bg-zinc-700/70 transition-colors">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold rounded-xl bg-emerald-500 text-zinc-950 hover:bg-emerald-400 transition-colors">
                        创建分类
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 弹窗 2：删除分类二次确认 -->
    <div id="delete-cat-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-5 shadow-2xl">
            <h2 class="text-base font-bold text-white mb-1.5">确认删除分类？</h2>
            <p id="delete-cat-desc" class="text-xs text-zinc-400 leading-relaxed mb-5">该分类及其内部所有条目都将被移除，并同步到云端。</p>
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="cancel-delete-cat" class="px-3.5 py-2 text-xs font-medium rounded-xl bg-elevated text-zinc-300 hover:bg-zinc-700/70 transition-colors">
                    取消
                </button>
                <button type="button" id="confirm-delete-cat" class="px-4 py-2 text-xs font-semibold rounded-xl bg-red-500/90 text-white hover:bg-red-500 transition-colors">
                    确认删除
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 3：重置列表确认 -->
    <div id="reset-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-5 shadow-2xl">
            <h2 class="text-base font-bold text-white mb-1.5">重置为初始清单？</h2>
            <p class="text-xs text-zinc-400 leading-relaxed mb-5">这将清空当前所有勾选状态与自定义增删内容，恢复为最初的 5 个分组共 32 个条目，并覆盖云端数据。</p>
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="cancel-reset" class="px-3.5 py-2 text-xs font-medium rounded-xl bg-elevated text-zinc-300 hover:bg-zinc-700/70 transition-colors">
                    取消
                </button>
                <button type="button" id="confirm-reset" class="px-4 py-2 text-xs font-semibold rounded-xl bg-amber-500 text-zinc-950 hover:bg-amber-400 transition-colors">
                    确认重置
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 4：云端版本冲突（409 Conflict）处理 -->
    <div id="conflict-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-amber-500/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center gap-2 text-amber-400 mb-1.5">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
                <h2 class="text-base font-bold text-white">检测到另一端已更新</h2>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed mb-4">云端文件刚刚被另一台设备修改过，请选择处理方式：</p>
            <div class="flex flex-col gap-2">
                <button type="button" id="conflict-pull-btn" class="w-full px-3.5 py-2 text-xs font-semibold rounded-xl bg-sky-500 text-zinc-950 hover:bg-sky-400 transition-colors">
                    拉取云端最新版本（推荐）
                </button>
                <button type="button" id="conflict-force-btn" class="w-full px-3.5 py-2 text-xs font-medium rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition-colors">
                    用我当前的修改覆盖云端
                </button>
                <button type="button" id="conflict-cancel-btn" class="w-full px-3.5 py-1.5 text-xs text-zinc-400 hover:text-zinc-200 transition-colors">
                    暂不处理
                </button>
            </div>
        </div>
    </div>

    <!-- 底部轻提示 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200 max-w-[90vw]">
        <div class="px-4 py-2 rounded-full bg-elevated/95 border border-zinc-700 text-zinc-100 text-xs sm:text-sm font-medium shadow-xl backdrop-blur-md flex items-center gap-2">
            <span id="toast-dot" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
            <span id="toast-text" class="truncate">操作成功</span>
        </div>
    </div>

    <!-- 全局异常兜底提示条 -->
    <div id="fatal-error-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 max-w-lg w-[92vw] bg-red-950/95 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-xs shadow-2xl">
        <div class="font-semibold text-red-300 mb-0.5">页面脚本异常</div>
        <div id="fatal-error-msg" class="break-all opacity-90"></div>

            // 应用全局状态

            /* ==================== 工具函数 ==================== */

            function utf8ToBase64(str) {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const cleanBase64 = base64.replace(/\s+/g, '');
                const binary = atob(cleanBase64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            }

                toastTextEl.textContent = message;
                toastDotEl.className = 'w-2 h-2 rounded-full shrink-0 ' + (
                    type === 'success' ? 'bg-emerald-400' :
                    type === 'error' ? 'bg-red-400' :
                    type === 'warn' ? 'bg-amber-400' : 'bg-sky-400'
                );
                toastEl.classList.remove('opacity-0', 'translate-y-2');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.add('opacity-0', 'translate-y-2');
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                }, 2600);
            }

            function openModal(modalEl, focusInput) {
                if (!modalEl) return;
                modalEl.classList.remove('hidden');
                modalEl.classList.add('flex');
                if (focusInput) {
                    setTimeout(() => focusInput.focus(), 40);
                }
            }

            function closeModal(modalEl) {
                if (!modalEl) return;
                modalEl.classList.add('hidden');
                modalEl.classList.remove('flex');
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function generateId(prefix) {
                return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
            }

            function formatTimestamp(isoOrDate) {
                const date = isoOrDate ? new Date(isoOrDate) : new Date();
                if (Number.isNaN(date.getTime())) return '刚刚';
                const now = new Date();
                const isToday =
                    date.getFullYear() === now.getFullYear() &&
                    date.getMonth() === now.getMonth() &&
                    date.getDate() === now.getDate();
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                if (isToday) {
                    return `今天 ${hh}:${mm}`;
                }
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${month}-${day} ${hh}:${mm}`;
            }

            function setLastUpdated(timeText) {
                lastUpdatedStr = timeText;
                if (lastUpdatedLabel) {
                    lastUpdatedLabel.textContent = `最后更新: ${timeText}`;
                }
                try {
                    localStorage.setItem(LAST_UPDATED_STORAGE_KEY, timeText);
                } catch (e) {
                    // 忽略存储限制
                }
            }

            function updateSyncBadge(state, customLabel) {
                syncState = state;
                if (!syncStatusPill || !syncStatusDot || !syncStatusText) return;

                if (state === 'syncing') {
                    syncStatusPill.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-500/15 text-sky-300 border border-sky-500/30 transition-all cursor-wait';
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 animate-ping';
                    syncStatusText.textContent = customLabel || '同步中...';
                } else if (state === 'error') {
                    syncStatusPill.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-500/15 text-red-400 border border-red-500/30 hover:bg-red-500/25 active:scale-95 transition-all cursor-pointer';
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-400';
                    syncStatusText.textContent = customLabel || '同步失败 (点击重试)';
                } else {
                    syncStatusPill.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25 active:scale-95 transition-all cursor-pointer';
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
                    syncStatusText.textContent = customLabel || '已同步';
                }
            }

            /* ==================== 本地缓存存取 ==================== */

            function loadLocalData() {
                try {
                    const raw = localStorage.getItem(DATA_STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            categories = parsed;
                        } else {
                            categories = createInitialData();
                        }
                    } else {
                        categories = createInitialData();
                    }
                    lastSha = localStorage.getItem(SHA_STORAGE_KEY) || null;
                    const savedTime = localStorage.getItem(LAST_UPDATED_STORAGE_KEY);
                    if (savedTime) {
                        lastUpdatedStr = savedTime;
                        if (lastUpdatedLabel) {
                            lastUpdatedLabel.textContent = `最后更新: ${savedTime}`;
                        }
                    }
                } catch (e) {
                    categories = createInitialData();
                }
            }

            function saveLocalData() {
                try {
                    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(categories));
                } catch (e) {
                    console.warn('保存本地清单缓存失败:', e);
                }
            }

            function saveSha(sha) {
                lastSha = sha;
                try {
                    if (sha) {
                        localStorage.setItem(SHA_STORAGE_KEY, sha);
                    } else {
                        localStorage.removeItem(SHA_STORAGE_KEY);
                    }
                } catch (e) {
                    // 忽略存储限制
                }
            }

            /* ==================== GitHub Contents API 云同步 ==================== */

            async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const res = await fetch(url, {
                        ...options,
                        signal: controller.signal
                    });
                    return res;
                } finally {
                    clearTimeout(timer);
                }
            }

            function getContentsApiUrl(withTimestamp = false) {
                const encodedPath = GH_CONFIG.path
                    .split('/')
                    .map((seg) => encodeURIComponent(seg))
                    .join('/');
                const baseUrl = `https://api.github.com/repos/${encodeURIComponent(GH_CONFIG.owner)}/${encodeURIComponent(GH_CONFIG.repo)}/contents/${encodedPath}`;
                const params = new URLSearchParams();
                if (GH_CONFIG.branch) params.set('ref', GH_CONFIG.branch);
                if (withTimestamp) params.set('_t', String(Date.now()));
                const qs = params.toString();
                return qs ? `${baseUrl}?${qs}` : baseUrl;
            }

            function getAuthHeaders(includeJsonContent = false) {
                const headers = {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${GH_CONFIG.token}`,
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                if (includeJsonContent) {
                    headers['Content-Type'] = 'application/json';
                }
                return headers;
            }

            async function pullFromGitHub(silent = false) {
                if (isSyncingNow) return;
                isSyncingNow = true;
                updateSyncBadge('syncing', '拉取中...');

                try {
                    const res = await fetchWithTimeout(getContentsApiUrl(true), {
                        method: 'GET',
                        headers: getAuthHeaders(false),
                        cache: 'no-store'
                    });

                    if (res.status === 404) {
                        // 仓库尚无 data.json，释放拉取锁并自动初始化推送
                        isSyncingNow = false;
                        saveSha(null);
                        await pushToGitHub({ forceOverwrite: true, commitMessage: 'chore: 初始化清单数据 data.json', silent });
                        return;
                    }

                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    const payload = await res.json();
                    if (!payload || typeof payload.content !== 'string') {
                        throw new Error('云端返回格式异常');
                    }

                    const decodedStr = base64ToUtf8(payload.content);
                    const remoteJson = JSON.parse(decodedStr);

                    if (Array.isArray(remoteJson)) {
                        categories = remoteJson;
                    } else if (remoteJson && Array.isArray(remoteJson.categories)) {
                        categories = remoteJson.categories;
                        if (remoteJson.updatedAt) {
                            setLastUpdated(formatTimestamp(remoteJson.updatedAt));
                        }
                    } else {
                        throw new Error('云端清单数据结构无效');
                    }

                    saveSha(payload.sha || null);
                    saveLocalData();
                    render();

                    if (!remoteJson.updatedAt) {
                        setLastUpdated(formatTimestamp(new Date()));
                    }
                    updateSyncBadge('synced', '已同步');
                    if (!silent) {
                        showToast('已从云端同步最新清单', 'success');
                    }
                } catch (err) {
                    const isTimeout = err && err.name === 'AbortError';
                    const reason = isTimeout ? '连接超时 (点击重试)' : `同步失败 (${err.message || '网络异常'})`;
                    updateSyncBadge('error', reason);
                    if (!silent) {
                        showToast(isTimeout ? '连接 GitHub 超时，请检查网络' : `拉取失败: ${err.message}`, 'error');
                    }
                } finally {
                    isSyncingNow = false;
                    if (pendingPushAfterSync) {
                        pendingPushAfterSync = false;
                        schedulePushToGitHub();
                    }
                }
            }

            async function pushToGitHub({ forceOverwrite = false, commitMessage = 'chore: 更新采购与物品清单', silent = true } = {}) {
                if (isSyncingNow) {
                    pendingPushAfterSync = true;
                    return;
                }
                isSyncingNow = true;
                updateSyncBadge('syncing', '保存中...');

                try {
                    // 若缺少 SHA，先快速获取一次远端 SHA
                    if (!lastSha && !forceOverwrite) {
                        const headRes = await fetchWithTimeout(getContentsApiUrl(true), {
                            method: 'GET',
                            headers: getAuthHeaders(false),
                            cache: 'no-store'
                        });
                        if (headRes.ok) {
                            const headData = await headRes.json();
                            if (headData && headData.sha) {
                                saveSha(headData.sha);
                            }
                        }
                    }

                    const nowIso = new Date().toISOString();
                    const fileObj = {
                        updatedAt: nowIso,
                        categories: categories
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(fileObj, null, 2));

                    const body = {
                        message: commitMessage,
                        content: contentBase64,
                        branch: GH_CONFIG.branch
                    };
                    if (lastSha) {
                        body.sha = lastSha;
                    }

                    const putRes = await fetchWithTimeout(getContentsApiUrl(false), {
                        method: 'PUT',
                        headers: getAuthHeaders(true),
                        body: JSON.stringify(body)
                    });

                    if (putRes.status === 409) {
                        updateSyncBadge('error', '版本冲突 (点击处理)');
                        openModal(conflictModal);
                        return;
                    }

                    if (!putRes.ok) {
                        throw new Error(`HTTP ${putRes.status}`);
                    }

                    const result = await putRes.json();
                    if (result && result.content && result.content.sha) {
                        saveSha(result.content.sha);
                    }
                    setLastUpdated(formatTimestamp(nowIso));
                    updateSyncBadge('synced', '已同步');
                    if (!silent) {
                        showToast('已同步到云端', 'success');
                    }
                } catch (err) {
                    const isTimeout = err && err.name === 'AbortError';
                    const reason = isTimeout ? '保存超时 (点击重试)' : `同步失败 (${err.message || '网络异常'})`;
                    updateSyncBadge('error', reason);
                    if (!silent) {
                        showToast(isTimeout ? '同步超时，请检查网络后重试' : `同步失败: ${err.message}`, 'error');
                    }
                } finally {
                    isSyncingNow = false;
                }
            }

            function schedulePushToGitHub() {
                if (pushDebounceTimer) clearTimeout(pushDebounceTimer);
                updateSyncBadge('syncing', '待同步...');
                pushDebounceTimer = setTimeout(() => {
                    pushToGitHub({ silent: true });
                }, 800);
            }

            function commitLocalChange() {
                saveLocalData();
                render();
                schedulePushToGitHub();
            }

            /* ==================== 渲染与统计 ==================== */

            function updateStats() {
                let total = 0;
                let completed = 0;
                categories.forEach((cat) => {
                    total += cat.items.length;
                    cat.items.forEach((item) => {
                        if (item.completed) completed++;
                    });
                });
                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
                if (statCompleted) statCompleted.textContent = String(completed);
                if (statTotal) statTotal.textContent = String(total);
                if (statPercent) statPercent.textContent = `${percent}%`;
                if (progressBar) progressBar.style.width = `${percent}%`;
            }

            function updateFilterButtons() {
                filterBtns.forEach((btn) => {
                    const isActive = btn.dataset.filter === currentFilter;
                    if (isActive) {
                        btn.className = 'filter-btn px-3 py-1 text-xs font-medium rounded-lg transition-all bg-elevated text-white shadow-sm';
                    } else {
                        btn.className = 'filter-btn px-3 py-1 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
                    }
                });
            }

            function buildCategoryCard(cat) {
                const totalCount = cat.items.length;
                const completedCount = cat.items.filter((i) => i.completed).length;
                const isAllDone = totalCount > 0 && completedCount === totalCount;

                const filteredItems = cat.items.filter((item) => {
                    if (currentFilter === 'active') return !item.completed;
                    if (currentFilter === 'completed') return item.completed;
                    return true;
                });

                let itemsHtml = '';
                if (filteredItems.length === 0) {
                    const emptyTip =
                        totalCount === 0
                            ? '暂无条目，在下方添加'
                            : currentFilter === 'active'
                                ? '本组已全部完成'
                                : '暂无已完成条目';
                    itemsHtml = `<li class="py-3 text-center text-xs text-zinc-500 select-none">${emptyTip}</li>`;
                } else {
                    itemsHtml = filteredItems
                        .map((item) => {
                            return `
                                <li class="group flex items-center justify-between gap-1.5 px-1.5 py-1 rounded-xl hover:bg-elevated/80 transition-colors">
                                    <button
                                        type="button"
                                        data-action="toggle-item"
                                        data-cat-id="${cat.id}"
                                        data-item-id="${item.id}"
                                        class="flex-1 flex items-center gap-2.5 text-left min-w-0 py-0.5 cursor-pointer"
                                    >
                                        <span class="w-4 h-4 rounded-full flex items-center justify-center shrink-0 transition-all ${
                                            item.completed
                                                ? 'bg-emerald-400 text-zinc-950 shadow-sm shadow-emerald-500/30'
                                                : 'border-[1.5px] border-zinc-600 group-hover:border-zinc-400'
                                        }">
                                            ${
                                                item.completed
                                                    ? '<svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>'
                                                    : ''
                                            }
                                        </span>
                                        <span class="text-[13.5px] leading-snug break-words transition-all ${
                                            item.completed ? 'line-through text-zinc-500' : 'text-zinc-100'
                                        }">${escapeHtml(item.text)}</span>
                                    </button>
                                    <button
                                        type="button"
                                        data-action="delete-item"
                                        data-cat-id="${cat.id}"
                                        data-item-id="${item.id}"
                                        class="p-1 rounded-lg text-zinc-500 opacity-70 sm:opacity-0 sm:group-hover:opacity-100 hover:text-red-400 hover:bg-red-500/10 transition-all shrink-0"
                                        title="删除此项"
                                        aria-label="删除条目"
                                    >
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </li>
                            `;
                        })
                        .join('');
                }

                return `
                    <section class="bg-card border border-zinc-800/80 rounded-2xl p-3 shadow-lg shadow-black/25 flex flex-col w-full">
                        <!-- 分类标题栏 -->
                        <div class="flex items-center justify-between gap-2 pb-2 mb-1.5 border-b border-zinc-800/75">
                            <div class="flex items-center gap-2 min-w-0">
                                <h2 class="text-sm font-bold text-white truncate">${escapeHtml(cat.title)}</h2>
                                <span class="px-2 py-0.5 text-[11px] font-medium rounded-full tabular-nums shrink-0 ${
                                    isAllDone
                                        ? 'bg-emerald-500/15 text-emerald-400'
                                        : 'bg-elevated text-zinc-400'
                                }">
                                    ${completedCount}/${totalCount}
                                </span>
                            </div>
                            <button
                                type="button"
                                data-action="delete-cat"
                                data-cat-id="${cat.id}"
                                class="p-1 rounded-lg text-zinc-500 hover:text-red-400 hover:bg-red-500/10 transition-colors shrink-0"
                                title="删除此分类"
                                aria-label="删除分类"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                </svg>
                            </button>
                        </div>

                        <!-- 条目列表 -->
                        <ul class="flex flex-col gap-0.5 mb-2">
                            ${itemsHtml}
                        </ul>

                        <!-- 分组底部快速添加 -->
                        <form data-action="add-item" data-cat-id="${cat.id}" class="flex items-center gap-1.5 pt-2 border-t border-zinc-800/60 mt-auto">
                            <input
                                type="text"
                                name="itemText"
                                placeholder="添加条目..."
                                autocomplete="off"
                                maxlength="60"
                                class="flex-1 min-w-0 px-2.5 py-1.5 text-xs bg-base border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500/60 focus:ring-1 focus:ring-sky-500/30 transition-all"
                            >
                            <button
                                type="submit"
                                class="w-7 h-7 flex items-center justify-center rounded-xl bg-elevated hover:bg-emerald-400 text-zinc-200 hover:text-zinc-950 active:scale-95 transition-all shrink-0"
                                title="添加条目"
                                aria-label="添加条目"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </button>
                        </form>
                    </section>
                `;
            }

            // 根据容器实际宽度计算最大可容纳列数
            function calculateColumnCount() {
                if (!masonryContainer) return 1;
                const containerWidth = masonryContainer.clientWidth || window.innerWidth;
                return Math.max(1, Math.floor((containerWidth + COL_GAP) / (MIN_COL_WIDTH + COL_GAP)));
            }

            // 估算卡片相对高度，用于后续卡片填补最短列
            function estimateCardWeight(cat) {
                const visibleCount = cat.items.filter((item) => {
                    if (currentFilter === 'active') return !item.completed;
                    if (currentFilter === 'completed') return item.completed;
                    return true;
                }).length;
                return 90 + Math.max(1, visibleCount) * 32;
            }

            /**
             * 横向优先智能瀑布流渲染：
             * 1. 前 colCount 个分类依次横向铺入第 1 列到第 colCount 列，优先占满整行宽度
             * 2. 第 colCount + 1 个及之后的分类，插入当前累计高度最短的列底部，填补短卡片下方空隙
             */
            function render() {
                if (!masonryContainer) return;

                const colCount = calculateColumnCount();
                currentColCount = colCount;

                const columns = Array.from({ length: colCount }, () => []);
                const colHeights = new Array(colCount).fill(0);

                categories.forEach((cat, idx) => {
                    let targetCol = 0;
                    if (idx < colCount) {
                        targetCol = idx;
                    } else {
                        let minH = colHeights[0];
                        for (let c = 1; c < colCount; c++) {
                            if (colHeights[c] < minH) {
                                minH = colHeights[c];
                                targetCol = c;
                            }
                        }
                    }

                    columns[targetCol].push(buildCategoryCard(cat));
                    colHeights[targetCol] += estimateCardWeight(cat) + COL_GAP;
                });

                masonryContainer.innerHTML = columns
                    .map((cardsHtml) => `
                        <div class="flex-1 min-w-0 flex flex-col gap-3">
                            ${cardsHtml.join('')}
                        </div>
                    `)
                    .join('');

                updateStats();
                updateFilterButtons();
            }

            /* ==================== 清单数据操作 ==================== */

            function toggleItem(catId, itemId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;
                const item = cat.items.find((i) => i.id === itemId);
                if (!item) return;
                item.completed = !item.completed;
                commitLocalChange();
            }

            function addItem(catId, text) {
                const trimmed = text.trim();
                if (!trimmed) return;
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;
                cat.items.push({
                    id: generateId('item'),
                    text: trimmed,
                    completed: false
                });
                commitLocalChange();
                showToast(`已添加「${trimmed}」`, 'success');
            }

            function deleteItem(catId, itemId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;
                const idx = cat.items.findIndex((i) => i.id === itemId);
                if (idx === -1) return;
                const removed = cat.items.splice(idx, 1)[0];
                commitLocalChange();
                showToast(`已删除「${removed.text}」`, 'info');
            }

            function addCategory(title, column) {
                const trimmed = title.trim();
                if (!trimmed) return;
                const newCat = {
                    id: generateId('cat'),
                    title: trimmed,
                    column: column === 'left' ? 'left' : 'right',
                    items: []
                };
                if (column === 'left') {
                    categories.unshift(newCat);
                } else {
                    categories.push(newCat);
                }
                commitLocalChange();
                showToast(`已创建分类「${trimmed}」`, 'success');
            }

            function requestDeleteCategory(catId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;
                pendingDeleteCatId = catId;
                if (deleteCatDesc) {
                    deleteCatDesc.textContent = `确定要删除分类「${cat.title}」及其包含的 ${cat.items.length} 个条目吗？此操作会同步到云端。`;
                }
                openModal(deleteCatModal);
            }

            function confirmDeleteCategory() {
                if (!pendingDeleteCatId) return;
                const idx = categories.findIndex((c) => c.id === pendingDeleteCatId);
                if (idx !== -1) {
                    const removed = categories.splice(idx, 1)[0];
                    commitLocalChange();
                    showToast(`已删除分类「${removed.title}」`, 'info');
                }
                pendingDeleteCatId = null;
                closeModal(deleteCatModal);
            }

            function resetToInitial() {
                categories = createInitialData();
                currentFilter = 'all';
                commitLocalChange();
                showToast('已重置为初始清单', 'info');
            }

            /* ==================== 事件绑定 ==================== */

            function bindEvents() {
                // 瀑布流容器内部事件委托
                if (masonryContainer) {
                    masonryContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('button[data-action]');
                        if (!btn) return;
                        const action = btn.dataset.action;
                        const catId = btn.dataset.catId;
                        const itemId = btn.dataset.itemId;

                        if (action === 'toggle-item') {
                            toggleItem(catId, itemId);
                        } else if (action === 'delete-item') {
                            deleteItem(catId, itemId);
                        } else if (action === 'delete-cat') {
                            requestDeleteCategory(catId);
                        }
                    });

                    masonryContainer.addEventListener('submit', (e) => {
                        const form = e.target.closest('form[data-action="add-item"]');
                        if (!form) return;
                        e.preventDefault();
                        const catId = form.dataset.catId;
                        const input = form.querySelector('input[name="itemText"]');
                        if (!input) return;
                        const text = input.value;
                        if (text.trim()) {
                            addItem(catId, text);
                            // 保持焦点便于连续录入
                            const nextInput = masonryContainer.querySelector(`form[data-cat-id="${catId}"] input[name="itemText"]`);
                            if (nextInput) nextInput.focus();
                        }
                    });
                }

                // 顶部状态筛选切换
                filterBtns.forEach((btn) => {
                    btn.addEventListener('click', () => {
                        currentFilter = btn.dataset.filter || 'all';
                        render();
                    });
                });

                // 顶部同步徽章点击：立即手动拉取云端或重试
                if (syncStatusPill) {
                    syncStatusPill.addEventListener('click', () => {
                        pullFromGitHub(false);
                    });
                }

                // 新增分类弹窗
                if (openAddCatBtn) {
                    openAddCatBtn.addEventListener('click', () => {
                        if (addCatForm) addCatForm.reset();
                        openModal(addCatModal, newCatNameInput);
                    });
                }
                if (cancelAddCatBtn) {
                    cancelAddCatBtn.addEventListener('click', () => closeModal(addCatModal));
                }
                if (addCatForm) {
                    addCatForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const title = newCatNameInput ? newCatNameInput.value : '';
                        const colRadio = addCatForm.querySelector('input[name="catColumn"]:checked');
                        const col = colRadio ? colRadio.value : 'left';
                        if (title.trim()) {
                            addCategory(title, col);
                            closeModal(addCatModal);
                        }
                    });
                }

                // 删除分类确认弹窗
                if (cancelDeleteCatBtn) {
                    cancelDeleteCatBtn.addEventListener('click', () => {
                        pendingDeleteCatId = null;
                        closeModal(deleteCatModal);
                    });
                }
                if (confirmDeleteCatBtn) {
                    confirmDeleteCatBtn.addEventListener('click', confirmDeleteCategory);
                }

                // 重置弹窗
                if (openResetBtn) {
                    openResetBtn.addEventListener('click', () => openModal(resetModal));
                }
                if (cancelResetBtn) {
                    cancelResetBtn.addEventListener('click', () => closeModal(resetModal));
                }
                if (confirmResetBtn) {
                    confirmResetBtn.addEventListener('click', () => {
                        resetToInitial();
                        closeModal(resetModal);
                    });
                }

                // 409 版本冲突弹窗
                if (conflictPullBtn) {
                    conflictPullBtn.addEventListener('click', () => {
                        closeModal(conflictModal);
                        pullFromGitHub(false);
                    });
                }
                if (conflictForceBtn) {
                    conflictForceBtn.addEventListener('click', async () => {
                        closeModal(conflictModal);
                        // 获取最新 SHA 后强制覆盖
                        try {
                            const headRes = await fetchWithTimeout(getContentsApiUrl(true), {
                                method: 'GET',
                                headers: getAuthHeaders(false),
                                cache: 'no-store'
                            });
                            if (headRes.ok) {
                                const headData = await headRes.json();
                                if (headData && headData.sha) saveSha(headData.sha);
                            }
                        } catch (e) {
                            // 忽略获取失败，继续尝试写入
                        }
                        pushToGitHub({ forceOverwrite: true, silent: false });
                    });
                }
                if (conflictCancelBtn) {
                    conflictCancelBtn.addEventListener('click', () => closeModal(conflictModal));
                }

                // 点击遮罩关闭弹窗
                [addCatModal, deleteCatModal, resetModal, conflictModal].forEach((modalEl) => {
                    if (!modalEl) return;
                    modalEl.addEventListener('click', (e) => {
                        if (e.target === modalEl) {
                            closeModal(modalEl);
                            if (modalEl === deleteCatModal) pendingDeleteCatId = null;
                        }
                    });
                });

                // ESC 键关闭所有弹窗
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeModal(addCatModal);
                        closeModal(deleteCatModal);
                        closeModal(resetModal);
                        closeModal(conflictModal);
                        pendingDeleteCatId = null;
                    }
                });

                // 窗口宽度变化时实时重新计算列数并重排
                window.addEventListener('resize', () => {
                    if (resizeRafId) cancelAnimationFrame(resizeRafId);
                    resizeRafId = requestAnimationFrame(() => {
                        const nextCols = calculateColumnCount();
                        if (nextCols !== currentColCount) {
                            render();
                        }
                    });
                });
            }

            /* ==================== 启动初始化 ==================== */

            function init() {
                loadLocalData();
                bindEvents();
                render();
                // 页面加载完成后静默拉取一次云端最新数据
                pullFromGitHub(true);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
