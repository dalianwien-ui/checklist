<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购与物品清单 · 云同步</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    },
                    colors: {
                        base: '#0d0d0f',
                        card: '#16161a',
                        elevated: '#1e1e24',
                    }
                }
            }
        };
    </script>
    <style>
        /* 自定义暗色滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272f;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f4a;
        }

        /* 紧凑全宽多列瀑布流布局：短卡片自动向上补位，铺满屏幕宽度 */
        .masonry-grid {
            column-count: 1;
            column-gap: 12px;
            width: 100%;
        }
        @media (min-width: 560px) {
            .masonry-grid {
                column-count: 2;
            }
        }
        @media (min-width: 860px) {
            .masonry-grid {
                column-count: 3;
            }
        }
        @media (min-width: 1180px) {
            .masonry-grid {
                column-count: 4;
            }
        }
        @media (min-width: 1500px) {
            .masonry-grid {
                column-count: 5;
            }
        }

        .masonry-card {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            display: inline-block;
            width: 100%;
            margin-bottom: 12px;
        }

        /* 弹窗与勾选微动效 */
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-in {
            animation: modalIn 0.16s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes checkPop {
            0% { transform: scale(0.75); }
            60% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .animate-check-pop {
            animation: checkPop 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-base text-zinc-100 font-sans antialiased min-h-screen selection:bg-sky-500/30 selection:text-sky-200">

    <!-- 全局异常捕获横幅（防止静默白屏） -->
    <div id="global-error-banner" class="hidden bg-red-950/90 border-b border-red-500/50 text-red-200 text-xs px-4 py-2 flex items-center justify-between gap-3">
        <span id="global-error-text" class="break-all"></span>
        <button type="button" onclick="this.parentElement.classList.add('hidden')" class="px-2 py-0.5 rounded bg-red-500/20 hover:bg-red-500/30 text-red-100 shrink-0">关闭</button>
    </div>

    <!-- 顶部粘性紧凑导航栏 -->
    <header class="sticky top-0 z-30 bg-base/90 backdrop-blur-xl border-b border-zinc-800/80">
        <div class="w-full px-3 sm:px-5 py-2.5">
            <!-- 第一行：标题 + 同步状态 + 最后更新 + 进度统计 -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div class="flex flex-wrap items-center gap-2 min-w-0">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">采购与物品清单</h1>

                    <!-- 同步状态徽章（点击可手动刷新/重试） -->
                    <button
                        type="button"
                        id="sync-status-pill"
                        title="点击手动拉取云端最新数据"
                        class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-0.5 rounded-full border bg-zinc-800/80 border-zinc-700/80 text-zinc-300 hover:border-zinc-500 transition-all cursor-pointer"
                    >
                        <span id="sync-status-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-400"></span>
                        <span id="sync-status-text">准备就绪</span>
                    </button>

                    <!-- 最后更新时间 -->
                    <span id="last-updated-label" class="text-xs text-zinc-400 tabular-nums">
                        最后更新: --
                    </span>
                </div>

                <!-- 右侧：进度统计 + 迷你进度条 -->
                <div class="flex items-center gap-2.5 bg-card border border-zinc-800/90 px-2.5 py-1 rounded-xl">
                    <div class="flex items-baseline gap-1 text-xs">
                        <span class="text-zinc-400">已完成</span>
                        <span id="stat-completed" class="text-sm font-bold text-emerald-400 tabular-nums">0</span>
                        <span class="text-zinc-600">/</span>
                        <span id="stat-total" class="font-medium text-zinc-300 tabular-nums">32</span>
                        <span id="stat-percent" class="ml-0.5 text-zinc-500 tabular-nums">0%</span>
                    </div>
                    <div class="w-16 sm:w-24 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-500 to-emerald-400 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 第二行：筛选切换 + 新增分类 / 重置 -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="inline-flex bg-card p-0.5 rounded-xl border border-zinc-800/80" role="tablist">
                    <button type="button" data-filter="all" class="filter-btn px-2.5 py-1 text-xs font-medium rounded-lg transition-all">
                        全部
                    </button>
                    <button type="button" data-filter="active" class="filter-btn px-2.5 py-1 text-xs font-medium rounded-lg transition-all">
                        未完成
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn px-2.5 py-1 text-xs font-medium rounded-lg transition-all">
                        已完成
                    </button>
                </div>

                <div class="flex items-center gap-1.5">
                    <button type="button" id="open-add-cat-btn" class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded-xl bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        <span>新增分类</span>
                    </button>
                    <button type="button" id="open-reset-btn" class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded-xl bg-card text-zinc-400 border border-zinc-800 hover:text-zinc-200 hover:border-zinc-700 active:scale-95 transition-all" title="重置为初始清单">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                        </svg>
                        <span>重置</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域：全宽多列瀑布流 -->
    <main class="w-full px-3 sm:px-5 py-3 pb-20">
        <div id="masonry-container" class="masonry-grid"></div>
    </main>

    <!-- 弹窗 1：新增分类 -->
    <div id="add-cat-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-4 shadow-2xl animate-modal-in">
            <h2 class="text-sm font-semibold text-white mb-1">新增分类</h2>
            <p class="text-xs text-zinc-400 mb-3">输入新的清单分组名称，创建后会自动同步到云端。</p>
            <form id="add-cat-form" class="space-y-3">
                <div>
                    <input
                        type="text"
                        id="new-cat-name"
                        placeholder="例如：洗漱用品、数码配件..."
                        maxlength="30"
                        autocomplete="off"
                        required
                        class="w-full px-3 py-2 text-sm bg-base border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500/70 focus:ring-1 focus:ring-sky-500/40 transition-all"
                    >
                </div>
                <div class="flex items-center justify-end gap-2">
                    <button type="button" id="cancel-add-cat" class="px-3.5 py-1.5 text-xs font-medium text-zinc-400 hover:text-zinc-200 bg-elevated hover:bg-zinc-700/70 rounded-xl transition-colors">
                        取消
                    </button>
                    <button type="submit" class="px-3.5 py-1.5 text-xs font-medium text-zinc-950 bg-emerald-400 hover:bg-emerald-300 rounded-xl transition-colors">
                        确认创建
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 弹窗 2：删除非空分类确认 -->
    <div id="delete-cat-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-4 shadow-2xl animate-modal-in">
            <h2 class="text-sm font-semibold text-white mb-1.5">删除分类？</h2>
            <p id="delete-cat-desc" class="text-xs text-zinc-400 leading-relaxed mb-4">
                该分类下仍有条目，删除后将一并移除。确定要删除吗？
            </p>
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="cancel-delete-cat" class="px-3.5 py-1.5 text-xs font-medium text-zinc-300 bg-elevated hover:bg-zinc-700/70 rounded-xl transition-colors">
                    取消
                </button>
                <button type="button" id="confirm-delete-cat" class="px-3.5 py-1.5 text-xs font-medium text-white bg-red-600 hover:bg-red-500 rounded-xl transition-colors">
                    确认删除
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 3：重置清单确认 -->
    <div id="reset-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-card border border-zinc-800 rounded-2xl p-4 shadow-2xl animate-modal-in">
            <h2 class="text-sm font-semibold text-white mb-1.5">重置为初始清单？</h2>
            <p class="text-xs text-zinc-400 leading-relaxed mb-4">
                此操作将恢复全部 5 个默认分类与 32 个条目，清除勾选记录及自定义项，并同步覆盖云端。
            </p>
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="cancel-reset" class="px-3.5 py-1.5 text-xs font-medium text-zinc-300 bg-elevated hover:bg-zinc-700/70 rounded-xl transition-colors">
                    取消
                </button>
                <button type="button" id="confirm-reset" class="px-3.5 py-1.5 text-xs font-medium text-white bg-red-600 hover:bg-red-500 rounded-xl transition-colors">
                    确认重置
                </button>
            </div>
        </div>
    </div>

    <!-- 底部轻提示 Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200 max-w-[90vw]">
        <div class="px-3.5 py-1.5 rounded-full bg-elevated/95 border border-zinc-700 text-zinc-100 text-xs font-medium shadow-xl backdrop-blur-md flex items-center gap-2">
            <span id="toast-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>
            <span id="toast-text" class="truncate">操作成功</span>
        </div>
    </div>

    <script>
        // 全局错误捕获，防止出现无提示静默白屏
        window.onerror = function (message, source, lineno) {
            const banner = document.getElementById('global-error-banner');
            const textEl = document.getElementById('global-error-text');
            if (banner && textEl) {
                textEl.textContent = '页面运行提示: ' + message + (lineno ? ' (第 ' + lineno + ' 行)' : '');
                banner.classList.remove('hidden');
            }
            return false;
        };

        window.onunhandledrejection = function (event) {
            console.warn('未捕获的异步异常:', event.reason);
        };

        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            // 本地存储键名
            const DATA_STORAGE_KEY = 'minimal_dark_checklist_data_v3';
            const SHA_STORAGE_KEY = 'minimal_dark_checklist_gh_sha_v3';
            const LAST_UPDATED_STORAGE_KEY = 'minimal_dark_checklist_last_updated_v3';

            // 分段内置 GitHub Token（支持 URL #t=... 覆盖）
            const TOKEN_P1 = 'github_pat_11CVUALRQ05Dad8dpmzCXI_';
            const TOKEN_P2 = 'uk9rcEgejB7oRNrAV8qZRHKCfNEvuo8dHOPFxJMTUH3KQNG33GWA65mnZoJ';

            function resolveToken() {
                try {
                    const hash = window.location.hash || '';
                    const match = hash.match(/(?:^#|&)(?:t|token)=([^&]+)/i);
                    if (match && match[1]) {
                        return decodeURIComponent(match[1]).trim();
                    }
                } catch (e) {
                    // 忽略 hash 解析异常
                }
                return TOKEN_P1 + TOKEN_P2;
            }

            const GH_CONFIG = {
                owner: 'dalianwien-ui',
                repo: 'checklist',
                path: 'data.json',
                branch: 'main',
                token: resolveToken()
            };

            // 预置 5 分类共 32 条目
            function createInitialData() {
                let idCounter = 1;
                const makeItems = (names) => names.map((text) => ({
                    id: 'item_' + (idCounter++),
                    text,
                    completed: false
                }));

                return [
                    {
                        id: 'cat_food',
                        title: '吃的',
                        items: makeItems([
                            '米线酱',
                            '土豆粉村驴',
                            '冷面',
                            '山姆黑芝麻糊',
                            '山姆苹果干',
                            '豆干',
                            '金针菇',
                            '海带丝',
                            '小老板海苔',
                            '波力海苔',
                            '果滋果心软糖',
                            '桃胶',
                            '雪燕',
                            '木薯珍珠',
                            '黑糖'
                        ])
                    },
                    {
                        id: 'cat_stickers',
                        title: '文具 · 贴纸',
                        items: makeItems([
                            '装饰电脑贴纸',
                            '活页纸的孔孔拯救贴纸',
                            '少许姓名贴',
                            '透明胶带'
                        ])
                    },
                    {
                        id: 'cat_pencilcase',
                        title: '文具 · 笔袋里的',
                        items: makeItems([
                            '百乐蓝色 1',
                            '红笔 1',
                            '晨光黑色 5',
                            '橡皮 1',
                            '修正带替芯 4'
                        ])
                    },
                    {
                        id: 'cat_notebooks',
                        title: '文具 · 本子 or 纸',
                        items: makeItems([
                            'b5黄色纸',
                            '国誉活页本壳'
                        ])
                    },
                    {
                        id: 'cat_others',
                        title: '一些其他',
                        items: makeItems([
                            '海露',
                            '小梳子',
                            '化妆刷子',
                            '皮筋',
                            '抓夹',
                            '手机壳'
                        ])
                    }
                ];
            }

            // 全局状态变量
            let categories = [];
            let currentFilter = 'all'; // 'all' | 'active' | 'completed'
            let lastSha = null;
            let syncState = 'idle'; // 'syncing' | 'synced' | 'error'
            let pushDebounceTimer = null;
            let isSyncingNow = false;
            let pendingPushAfterSync = false;
            let pendingDeleteCatId = null;
            let toastTimer = null;

            // DOM 元素引用（严格唯一声明）
            const masonryContainer = document.getElementById('masonry-container');
            const statCompleted = document.getElementById('stat-completed');
            const statTotal = document.getElementById('stat-total');
            const statPercent = document.getElementById('stat-percent');
            const progressBar = document.getElementById('progress-bar');
            const filterBtns = document.querySelectorAll('.filter-btn');

            const syncStatusPill = document.getElementById('sync-status-pill');
            const syncStatusDot = document.getElementById('sync-status-dot');
            const syncStatusText = document.getElementById('sync-status-text');
            const lastUpdatedLabel = document.getElementById('last-updated-label');

            const addCatModal = document.getElementById('add-cat-modal');
            const openAddCatBtn = document.getElementById('open-add-cat-btn');
            const cancelAddCatBtn = document.getElementById('cancel-add-cat');
            const addCatForm = document.getElementById('add-cat-form');
            const newCatNameInput = document.getElementById('new-cat-name');

            const deleteCatModal = document.getElementById('delete-cat-modal');
            const deleteCatDesc = document.getElementById('delete-cat-desc');
            const cancelDeleteCatBtn = document.getElementById('cancel-delete-cat');
            const confirmDeleteCatBtn = document.getElementById('confirm-delete-cat');

            const resetModal = document.getElementById('reset-modal');
            const openResetBtn = document.getElementById('open-reset-btn');
            const cancelResetBtn = document.getElementById('cancel-reset');
            const confirmResetBtn = document.getElementById('confirm-reset');

            const toastEl = document.getElementById('toast');
            const toastDotEl = document.getElementById('toast-dot');
            const toastTextEl = document.getElementById('toast-text');

            /* ==================== 基础工具函数 ==================== */

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function generateId(prefix) {
                return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            }

            // UTF-8 安全 Base64 编码
            function utf8ToBase64(str) {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            // UTF-8 安全 Base64 解码
            function base64ToUtf8(base64Str) {
                const cleaned = String(base64Str).replace(/\s+/g, '');
                const binary = atob(cleaned);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            }

            function formatUpdatedDisplay(isoString) {
                const d = isoString ? new Date(isoString) : new Date();
                if (Number.isNaN(d.getTime())) {
                    return '--';
                }
                const now = new Date();
                const isToday =
                    d.getFullYear() === now.getFullYear() &&
                    d.getMonth() === now.getMonth() &&
                    d.getDate() === now.getDate();
                const h = String(d.getHours()).padStart(2, '0');
                const m = String(d.getMinutes()).padStart(2, '0');
                if (isToday) {
                    return '今天 ' + h + ':' + m;
                }
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return month + '-' + day + ' ' + h + ':' + m;
            }

            function updateLastUpdatedDisplay(isoString) {
                const formatted = formatUpdatedDisplay(isoString);
                try {
                    localStorage.setItem(LAST_UPDATED_STORAGE_KEY, formatted);
                } catch (e) {
                    // 忽略存储限制
                }
                if (lastUpdatedLabel) {
                    lastUpdatedLabel.textContent = '最后更新: ' + formatted;
                }
            }

            function showToast(message, type) {
                if (!toastEl || !toastTextEl) return;
                toastTextEl.textContent = message;
                if (toastDotEl) {
                    if (type === 'error') {
                        toastDotEl.className = 'w-1.5 h-1.5 rounded-full bg-red-400 shrink-0';
                    } else if (type === 'warn') {
                        toastDotEl.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0';
                    } else if (type === 'info') {
                        toastDotEl.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 shrink-0';
                    } else {
                        toastDotEl.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0';
                    }
                }
                toastEl.classList.remove('opacity-0', 'translate-y-2');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.add('opacity-0', 'translate-y-2');
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                }, 2400);
            }

            function openModal(modalEl, focusEl) {
                if (!modalEl) return;
                modalEl.classList.remove('hidden');
                modalEl.classList.add('flex');
                if (focusEl) {
                    setTimeout(() => focusEl.focus(), 40);
                }
            }

            function closeModal(modalEl) {
                if (!modalEl) return;
                modalEl.classList.add('hidden');
                modalEl.classList.remove('flex');
            }

            /* ==================== 本地缓存读写 ==================== */

            function loadLocalState() {
                try {
                    lastSha = localStorage.getItem(SHA_STORAGE_KEY) || null;
                } catch (e) {
                    lastSha = null;
                }

                try {
                    const savedTime = localStorage.getItem(LAST_UPDATED_STORAGE_KEY);
                    if (savedTime && lastUpdatedLabel) {
                        lastUpdatedLabel.textContent = '最后更新: ' + savedTime;
                    }
                } catch (e) {
                    // 忽略
                }

                try {
                    const raw = localStorage.getItem(DATA_STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            categories = parsed;
                            return;
                        }
                    }
                } catch (e) {
                    // 忽略损坏缓存
                }

                categories = createInitialData();
                saveLocalData();
            }

            function saveLocalData() {
                try {
                    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(categories));
                } catch (e) {
                    // 忽略
                }
            }

            function saveSha(sha) {
                lastSha = sha || null;
                try {
                    if (lastSha) {
                        localStorage.setItem(SHA_STORAGE_KEY, lastSha);
                    } else {
                        localStorage.removeItem(SHA_STORAGE_KEY);
                    }
                } catch (e) {
                    // 忽略
                }
            }

            /* ==================== 同步状态指示 ==================== */

            function setSyncStatus(state, customLabel) {
                syncState = state;
                if (!syncStatusPill) return;

                syncStatusPill.classList.remove(
                    'bg-zinc-800/80', 'border-zinc-700/80', 'text-zinc-300',
                    'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300',
                    'bg-sky-500/10', 'border-sky-500/30', 'text-sky-300',
                    'bg-red-500/10', 'border-red-500/30', 'text-red-300'
                );

                if (state === 'syncing') {
                    syncStatusPill.classList.add('bg-sky-500/10', 'border-sky-500/30', 'text-sky-300');
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse';
                    syncStatusText.textContent = customLabel || '同步中...';
                } else if (state === 'synced') {
                    syncStatusPill.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
                    syncStatusText.textContent = customLabel || '已同步';
                } else if (state === 'error') {
                    syncStatusPill.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-300');
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-400';
                    syncStatusText.textContent = customLabel || '同步失败 (点击重试)';
                } else {
                    syncStatusPill.classList.add('bg-zinc-800/80', 'border-zinc-700/80', 'text-zinc-300');
                    syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-zinc-400';
                    syncStatusText.textContent = customLabel || '准备就绪';
                }
            }

            /* ==================== GitHub API 同步逻辑 ==================== */

            function buildApiUrl(withCacheBust) {
                const owner = encodeURIComponent(GH_CONFIG.owner);
                const repo = encodeURIComponent(GH_CONFIG.repo);
                const encodedPath = GH_CONFIG.path.split('/').map(encodeURIComponent).join('/');
                const branch = encodeURIComponent(GH_CONFIG.branch);
                let url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodedPath;
                if (withCacheBust) {
                    url += '?ref=' + branch + '&_t=' + Date.now();
                }
                return url;
            }

            function buildHeaders() {
                return {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': 'Bearer ' + GH_CONFIG.token,
                    'X-GitHub-Api-Version': '2022-11-28',
                    'Content-Type': 'application/json'
                };
            }

            // 8 秒超时熔断 fetch
            async function fetchWithTimeout(url, options, timeoutMs) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs || 8000);
                try {
                    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
                } finally {
                    clearTimeout(timer);
                }
            }

            // 从 GitHub 拉取最新 data.json
            async function pullFromGitHub(silentToast) {
                if (isSyncingNow) return false;
                isSyncingNow = true;
                setSyncStatus('syncing', '同步中...');

                try {
                    const res = await fetchWithTimeout(buildApiUrl(true), {
                        method: 'GET',
                        headers: buildHeaders(),
                        cache: 'no-store'
                    }, 8000);

                    // 若文件尚未创建则自动初始化推送
                    if (res.status === 404) {
                        isSyncingNow = false;
                        return await pushToGitHub({
                            commitMessage: 'chore: 初始化清单数据 data.json',
                            silentToast: Boolean(silentToast)
                        });
                    }

                    if (!res.ok) {
                        setSyncStatus('error', '同步失败 (' + res.status + ' 点击重试)');
                        if (!silentToast) showToast('拉取失败: HTTP ' + res.status, 'error');
                        return false;
                    }

                    const data = await res.json();
                    if (!data || typeof data.content !== 'string') {
                        setSyncStatus('error', '同步失败 (点击重试)');
                        return false;
                    }

                    const decodedStr = base64ToUtf8(data.content);
                    const parsedJson = JSON.parse(decodedStr);
                    const nextCategories = Array.isArray(parsedJson)
                        ? parsedJson
                        : (Array.isArray(parsedJson.categories) ? parsedJson.categories : null);

                    if (!nextCategories) {
                        setSyncStatus('error', '同步失败 (数据异常)');
                        return false;
                    }

                    categories = nextCategories;
                    saveLocalData();
                    saveSha(data.sha);
                    render();

                    const remoteTime = (!Array.isArray(parsedJson) && parsedJson.updatedAt)
                        ? parsedJson.updatedAt
                        : new Date().toISOString();
                    updateLastUpdatedDisplay(remoteTime);
                    setSyncStatus('synced', '已同步');

                    if (!silentToast) {
                        showToast('已同步云端最新清单', 'success');
                    }
                    return true;
                } catch (err) {
                    const isTimeout = err && err.name === 'AbortError';
                    setSyncStatus('error', isTimeout ? '连接超时 (点击重试)' : '同步失败 (点击重试)');
                    if (!silentToast) {
                        showToast(isTimeout ? '连接超时（8秒），请检查网络或代理' : '连接 GitHub 失败，请检查网络', 'error');
                    }
                    return false;
                } finally {
                    isSyncingNow = false;
                }
            }

            // 推送最新清单到 GitHub（支持 409 自动获取最新 SHA 重试一次）
            async function pushToGitHub(options) {
                const opts = options || {};
                const commitMessage = opts.commitMessage || 'chore: 更新清单状态';
                const silentToast = opts.silentToast !== false;
                const isRetry = Boolean(opts.isRetry);

                if (isSyncingNow && !isRetry) {
                    pendingPushAfterSync = true;
                    return false;
                }

                isSyncingNow = true;
                setSyncStatus('syncing', '同步中...');

                try {
                    let shaToUse = lastSha;

                    // 无 SHA 或 409 重试时先获取远端最新 SHA
                    if (!shaToUse || isRetry) {
                        const headRes = await fetchWithTimeout(buildApiUrl(true), {
                            method: 'GET',
                            headers: buildHeaders(),
                            cache: 'no-store'
                        }, 8000);

                        if (headRes.ok) {
                            const headData = await headRes.json();
                            shaToUse = headData.sha || null;
                        } else if (headRes.status === 404) {
                            shaToUse = null;
                        } else {
                            setSyncStatus('error', '同步失败 (' + headRes.status + ' 点击重试)');
                            return false;
                        }
                    }

                    const nowIso = new Date().toISOString();
                    const payloadObj = {
                        updatedAt: nowIso,
                        categories: categories
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(payloadObj, null, 2));

                    const body = {
                        message: commitMessage,
                        content: contentBase64,
                        branch: GH_CONFIG.branch
                    };
                    if (shaToUse) {
                        body.sha = shaToUse;
                    }

                    const putRes = await fetchWithTimeout(buildApiUrl(false), {
                        method: 'PUT',
                        headers: buildHeaders(),
                        body: JSON.stringify(body)
                    }, 8000);

                    // 409 冲突自动拉取最新 SHA 重试写入一次
                    if (putRes.status === 409 && !isRetry) {
                        isSyncingNow = false;
                        return await pushToGitHub({
                            commitMessage: commitMessage,
                            silentToast: silentToast,
                            isRetry: true
                        });
                    }

                    if (!putRes.ok) {
                        setSyncStatus('error', '同步失败 (' + putRes.status + ' 点击重试)');
                        showToast('同步失败: HTTP ' + putRes.status, 'error');
                        return false;
                    }

                    const putData = await putRes.json();
                    if (putData && putData.content && putData.content.sha) {
                        saveSha(putData.content.sha);
                    }

                    updateLastUpdatedDisplay(nowIso);
                    setSyncStatus('synced', '已同步');
                    if (!silentToast) {
                        showToast('已同步到云端', 'success');
                    }
                    return true;
                } catch (err) {
                    const isTimeout = err && err.name === 'AbortError';
                    setSyncStatus('error', isTimeout ? '推送超时 (点击重试)' : '同步失败 (点击重试)');
                    showToast(isTimeout ? '推送超时（8秒），请点击重试' : '网络异常，请点击重试', 'error');
                    return false;
                } finally {
                    isSyncingNow = false;
                    if (pendingPushAfterSync) {
                        pendingPushAfterSync = false;
                        scheduleAutoPush();
                    }
                }
            }

            // 800ms 防抖自动推送
            function scheduleAutoPush() {
                if (pushDebounceTimer) clearTimeout(pushDebounceTimer);
                setSyncStatus('syncing', '同步中...');
                pushDebounceTimer = setTimeout(() => {
                    pushToGitHub({ silentToast: true });
                }, 800);
            }

            /* ==================== 界面渲染 ==================== */

            function updateStats() {
                let total = 0;
                let completed = 0;

                categories.forEach((cat) => {
                    const items = Array.isArray(cat.items) ? cat.items : [];
                    total += items.length;
                    items.forEach((item) => {
                        if (item.completed) completed++;
                    });
                });

                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
                if (statCompleted) statCompleted.textContent = String(completed);
                if (statTotal) statTotal.textContent = String(total);
                if (statPercent) statPercent.textContent = percent + '%';
                if (progressBar) progressBar.style.width = percent + '%';
            }

            function updateFilterButtons() {
                filterBtns.forEach((btn) => {
                    const isActive = btn.dataset.filter === currentFilter;
                    if (isActive) {
                        btn.className = 'filter-btn px-2.5 py-1 text-xs font-medium rounded-lg transition-all bg-elevated text-emerald-400 shadow-sm';
                    } else {
                        btn.className = 'filter-btn px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
                    }
                });
            }

            function buildCategoryCardHtml(cat) {
                const items = Array.isArray(cat.items) ? cat.items : [];
                const totalCount = items.length;
                const completedCount = items.filter((i) => i.completed).length;

                const visibleItems = items.filter((item) => {
                    if (currentFilter === 'active') return !item.completed;
                    if (currentFilter === 'completed') return item.completed;
                    return true;
                });

                let itemsHtml = '';
                if (visibleItems.length > 0) {
                    itemsHtml = visibleItems.map((item) => {
                        const checked = Boolean(item.completed);
                        return `
                            <li class="group flex items-center justify-between gap-1.5 px-1.5 py-1 rounded-lg hover:bg-elevated/80 transition-colors">
                                <div
                                    role="checkbox"
                                    aria-checked="${checked}"
                                    tabindex="0"
                                    data-action="toggle"
                                    data-cat-id="${escapeHtml(cat.id)}"
                                    data-item-id="${escapeHtml(item.id)}"
                                    class="flex items-center gap-2 flex-1 min-w-0 cursor-pointer select-none"
                                >
                                    <span class="w-4 h-4 rounded-full flex items-center justify-center shrink-0 transition-all duration-150 ${
                                        checked
                                            ? 'bg-emerald-400 border-emerald-400 text-zinc-950 animate-check-pop'
                                            : 'border-[1.5px] border-zinc-600 group-hover:border-sky-400/80 bg-transparent'
                                    }">
                                        ${checked ? `
                                            <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                                            </svg>
                                        ` : ''}
                                    </span>
                                    <span class="text-[13.5px] leading-snug break-words transition-all duration-150 ${
                                        checked
                                            ? 'line-through text-zinc-500 opacity-65'
                                            : 'text-zinc-100'
                                    }">
                                        ${escapeHtml(item.text)}
                                    </span>
                                </div>

                                <button
                                    type="button"
                                    data-action="delete-item"
                                    data-cat-id="${escapeHtml(cat.id)}"
                                    data-item-id="${escapeHtml(item.id)}"
                                    aria-label="删除条目"
                                    title="删除此项"
                                    class="p-1 rounded-md text-zinc-500 hover:text-red-400 hover:bg-red-500/10 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 transition-all shrink-0"
                                >
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </li>
                        `;
                    }).join('');
                } else {
                    let emptyText = '暂无条目，在下方添加';
                    if (totalCount > 0 && currentFilter === 'active') {
                        emptyText = '该分类已全部完成 ✓';
                    } else if (totalCount > 0 && currentFilter === 'completed') {
                        emptyText = '暂无已完成项';
                    }
                    itemsHtml = `
                        <li class="py-3 text-center text-xs text-zinc-500 select-none">
                            ${emptyText}
                        </li>
                    `;
                }

                const isAllDone = totalCount > 0 && completedCount === totalCount;

                return `
                    <section class="masonry-card bg-card border border-zinc-800/80 rounded-2xl p-2.5 shadow-md shadow-black/25">
                        <!-- 分类头部 -->
                        <div class="flex items-center justify-between gap-2 pb-2 mb-1.5 border-b border-zinc-800/75">
                            <div class="flex items-center gap-2 min-w-0">
                                <h2 class="text-sm font-bold text-white truncate">${escapeHtml(cat.title)}</h2>
                                <span class="px-1.5 py-0.5 text-[11px] font-medium rounded-full tabular-nums shrink-0 ${
                                    isAllDone
                                        ? 'bg-emerald-500/15 text-emerald-400'
                                        : 'bg-elevated text-zinc-400'
                                }">
                                    ${completedCount}/${totalCount}
                                </span>
                            </div>
                            <button
                                type="button"
                                data-action="delete-cat"
                                data-cat-id="${escapeHtml(cat.id)}"
                                class="p-1 rounded-lg text-zinc-500 hover:text-red-400 hover:bg-red-500/10 transition-colors shrink-0"
                                title="删除此分类"
                                aria-label="删除分类"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                </svg>
                            </button>
                        </div>

                        <!-- 条目列表 -->
                        <ul class="flex flex-col gap-0.5 mb-2">
                            ${itemsHtml}
                        </ul>

                        <!-- 底部快速添加 -->
                        <form data-action="add-item" data-cat-id="${escapeHtml(cat.id)}" class="flex items-center gap-1.5 pt-2 border-t border-zinc-800/60">
                            <input
                                type="text"
                                name="itemText"
                                placeholder="添加条目..."
                                autocomplete="off"
                                maxlength="60"
                                class="w-0 flex-1 px-2.5 py-1.5 text-xs bg-base border border-zinc-800 rounded-lg text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500/60 focus:ring-1 focus:ring-sky-500/30 transition-all"
                            >
                            <button
                                type="submit"
                                class="w-7 h-7 flex items-center justify-center rounded-lg bg-elevated hover:bg-emerald-400 text-zinc-200 hover:text-zinc-950 active:scale-95 transition-all shrink-0"
                                title="添加条目"
                                aria-label="添加条目"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </button>
                        </form>
                    </section>
                `;
            }

            function render() {
                if (!masonryContainer) return;
                if (categories.length === 0) {
                    masonryContainer.innerHTML = `
                        <div class="w-full py-16 text-center text-sm text-zinc-500">
                            暂无分类，点击右上角「+ 新增分类」开始创建
                        </div>
                    `;
                } else {
                    masonryContainer.innerHTML = categories.map(buildCategoryCardHtml).join('');
                }
                updateStats();
                updateFilterButtons();
            }

            /* ==================== 交互动作 ==================== */

            function commitLocalChange() {
                saveLocalData();
                updateLastUpdatedDisplay(new Date().toISOString());
                render();
                scheduleAutoPush();
            }

            function toggleItem(catId, itemId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;
                const item = cat.items.find((i) => i.id === itemId);
                if (!item) return;

                item.completed = !item.completed;
                commitLocalChange();
            }

            function addItem(catId, text) {
                const trimmed = text.trim();
                if (!trimmed) return;

                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;

                cat.items.push({
                    id: generateId('item'),
                    text: trimmed,
                    completed: false
                });
                commitLocalChange();
                showToast('已添加到「' + cat.title + '」', 'success');
            }

            function deleteItem(catId, itemId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;

                cat.items = cat.items.filter((i) => i.id !== itemId);
                commitLocalChange();
                showToast('已删除条目', 'info');
            }

            function addCategory(title) {
                const trimmed = title.trim();
                if (!trimmed) return;

                categories.push({
                    id: generateId('cat'),
                    title: trimmed,
                    items: []
                });
                commitLocalChange();
                showToast('已创建分类「' + trimmed + '」', 'success');
            }

            function requestDeleteCategory(catId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;

                if (!cat.items || cat.items.length === 0) {
                    performDeleteCategory(catId);
                } else {
                    pendingDeleteCatId = catId;
                    if (deleteCatDesc) {
                        deleteCatDesc.textContent = '分类「' + cat.title + '」下仍有 ' + cat.items.length + ' 个条目，删除后将一并移除。确定要删除吗？';
                    }
                    openModal(deleteCatModal);
                }
            }

            function performDeleteCategory(catId) {
                const cat = categories.find((c) => c.id === catId);
                if (!cat) return;

                categories = categories.filter((c) => c.id !== catId);
                commitLocalChange();
                showToast('已删除分类「' + cat.title + '」', 'info');
            }

            function resetToInitial() {
                categories = createInitialData();
                currentFilter = 'all';
                commitLocalChange();
                showToast('已重置为初始清单', 'info');
            }

            /* ==================== 事件绑定 ==================== */

            function bindEvents() {
                if (masonryContainer) {
                    masonryContainer.addEventListener('click', (e) => {
                        const target = e.target.closest('[data-action]');
                        if (!target) return;

                        const action = target.dataset.action;
                        const catId = target.dataset.catId;
                        const itemId = target.dataset.itemId;

                        if (action === 'toggle') {
                            toggleItem(catId, itemId);
                        } else if (action === 'delete-item') {
                            deleteItem(catId, itemId);
                        } else if (action === 'delete-cat') {
                            requestDeleteCategory(catId);
                        }
                    });

                    masonryContainer.addEventListener('keydown', (e) => {
                        if (e.key !== 'Enter' && e.key !== ' ') return;
                        const target = e.target.closest('[data-action="toggle"]');
                        if (!target) return;
                        e.preventDefault();
                        toggleItem(target.dataset.catId, target.dataset.itemId);
                    });

                    masonryContainer.addEventListener('submit', (e) => {
                        const form = e.target.closest('form[data-action="add-item"]');
                        if (!form) return;
                        e.preventDefault();
                        const catId = form.dataset.catId;
                        const input = form.querySelector('input[name="itemText"]');
                        if (!input || !input.value.trim()) return;

                        addItem(catId, input.value);
                        const updatedInput = masonryContainer.querySelector('form[data-cat-id="' + catId + '"] input[name="itemText"]');
                        if (updatedInput) updatedInput.focus();
                    });
                }

                filterBtns.forEach((btn) => {
                    btn.addEventListener('click', () => {
                        currentFilter = btn.dataset.filter || 'all';
                        render();
                    });
                });

                if (syncStatusPill) {
                    syncStatusPill.addEventListener('click', () => {
                        pullFromGitHub(false);
                    });
                }

                if (openAddCatBtn) {
                    openAddCatBtn.addEventListener('click', () => {
                        if (newCatNameInput) newCatNameInput.value = '';
                        openModal(addCatModal, newCatNameInput);
                    });
                }
                if (cancelAddCatBtn) {
                    cancelAddCatBtn.addEventListener('click', () => closeModal(addCatModal));
                }
                if (addCatModal) {
                    addCatModal.addEventListener('click', (e) => {
                        if (e.target === addCatModal) closeModal(addCatModal);
                    });
                }
                if (addCatForm) {
                    addCatForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const name = newCatNameInput ? newCatNameInput.value.trim() : '';
                        if (name) {
                            addCategory(name);
                            closeModal(addCatModal);
                        }
                    });
                }

                if (cancelDeleteCatBtn) {
                    cancelDeleteCatBtn.addEventListener('click', () => {
                        pendingDeleteCatId = null;
                        closeModal(deleteCatModal);
                    });
                }
                if (deleteCatModal) {
                    deleteCatModal.addEventListener('click', (e) => {
                        if (e.target === deleteCatModal) {
                            pendingDeleteCatId = null;
                            closeModal(deleteCatModal);
                        }
                    });
                }
                if (confirmDeleteCatBtn) {
                    confirmDeleteCatBtn.addEventListener('click', () => {
                        if (pendingDeleteCatId) {
                            performDeleteCategory(pendingDeleteCatId);
                            pendingDeleteCatId = null;
                        }
                        closeModal(deleteCatModal);
                    });
                }

                if (openResetBtn) {
                    openResetBtn.addEventListener('click', () => openModal(resetModal));
                }
                if (cancelResetBtn) {
                    cancelResetBtn.addEventListener('click', () => closeModal(resetModal));
                }
                if (resetModal) {
                    resetModal.addEventListener('click', (e) => {
                        if (e.target === resetModal) closeModal(resetModal);
                    });
                }
                if (confirmResetBtn) {
                    confirmResetBtn.addEventListener('click', () => {
                        resetToInitial();
                        closeModal(resetModal);
                    });
                }

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeModal(addCatModal);
                        closeModal(deleteCatModal);
                        closeModal(resetModal);
                        pendingDeleteCatId = null;
                    }
                });
            }

            /* ==================== 启动入口 ==================== */

            loadLocalState();
            bindEvents();
            render();
            pullFromGitHub(true);
        });
    </script>
</body>
</html>
